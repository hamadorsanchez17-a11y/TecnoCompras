<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>TecnoCompras - Datos de Pago</title>
        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Iconos de Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Estilos principales de Bootstrap -->
        <link href="css/styles.css" rel="stylesheet" />
    </head>
    <body class="d-flex flex-column min-vh-100">
        <!-- Navegación -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand fw-bold" href="index.html">TecnoCompras</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="categorias.html">Categorías</a></li>
                    </ul>
                    <form class="d-flex">
                        <a class="btn btn-outline-dark" href="carrito.html">
                            <i class="bi-cart-fill me-1"></i>
                            Carrito
                            <span id="cart-count" class="badge bg-dark text-white ms-1 rounded-pill">0</span>
                        </a>
                    </form>
                </div>
            </div>
        </nav>

        <!-- Encabezado -->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Detalles de la Tarjeta</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Ingresa la información de tu tarjeta para procesar el pago</p>
                </div>
            </div>
        </header>

        <!-- Sección del Formulario -->
        <section class="py-5 my-auto">
            <div class="container px-4 px-lg-5">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">
                        <div class="card shadow-lg border-0 rounded-3">
                            <div class="card-body p-4 p-sm-5">
                                
                                <div class="text-center mb-4">
                                    <i class="bi bi-credit-card-2-front display-4 text-dark"></i>
                                    <h3 class="fw-bolder mt-2">Pago Seguro</h3>
                                    <p class="text-muted small">Aceptamos tarjetas de crédito y débito</p>
                                </div>

                                <form id="form-pago">
                                    <!-- Nombre en la tarjeta -->
                                    <div class="mb-3">
                                        <label for="nombreTarjeta" class="form-label">Nombre en la tarjeta</label>
                                        <input type="text" class="form-control" id="nombreTarjeta" placeholder="Nombre tal como aparece en la tarjeta" required />
                                    </div>

                                    <!-- Número de tarjeta -->
                                    <div class="mb-3">
                                        <label for="numeroTarjeta" class="form-label">Número de tarjeta</label>
                                        <div class="input-group">
                                            <input type="text" class="form-control" id="numeroTarjeta" placeholder="0000 0000 0000 0000" maxlength="19" required />
                                            <span class="input-group-text bg-white"><i class="bi bi-credit-card"></i></span>
                                        </div>
                                    </div>

                                    <!-- Vencimiento y CVV -->
                                    <div class="row g-3 mb-4">
                                        <div class="col-6">
                                            <label for="expiracion" class="form-label">Fecha de expiración</label>
                                            <input type="text" class="form-control" id="expiracion" placeholder="MM/AA" maxlength="5" required />
                                        </div>
                                        <div class="col-6">
                                            <label for="cvv" class="form-label">Código CVV / CVC</label>
                                            <input type="password" class="form-control" id="cvv" placeholder="123" maxlength="4" required />
                                        </div>
                                    </div>

                                    <!-- Botón de Pago -->
                                    <button class="btn btn-dark btn-lg w-100 fw-bold" type="submit">
                                        Pagar Ahora
                                    </button>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Pie de página -->
        <footer class="py-5 bg-dark mt-auto">
            <div class="container text-center text-white">
                <p class="m-0">Copyright &copy; TecnoCompras 2026</p>
            </div>
        </footer>

        <!-- Scripts de Bootstrap y proyecto -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
        <script src="js/global.js"></script>
        <script src="js/formulariopago.js"></script>
    </body>
</html>
