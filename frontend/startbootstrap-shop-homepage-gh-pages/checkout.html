<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>TecnoCompras - Checkout</title>
        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Iconos de Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Estilos principales de Bootstrap -->
        <link href="css/styles.css" rel="stylesheet" />
    </head>
    <body>
        <!-- Navegación -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand fw-bold" href="index.html">TecnoCompras</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="categorias.html">Categorías</a></li>
                    </ul>
                    <form class="d-flex">
                        <a class="btn btn-outline-dark" href="carrito.html">
                            <i class="bi-cart-fill me-1"></i>
                            Carrito
                            <span id="cart-count" class="badge bg-dark text-white ms-1 rounded-pill">0</span>
                        </a>
                    </form>
                </div>
            </div>
        </nav>
        <!-- Encabezado -->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Finalizar Compra</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Completa tus datos de envío y pago</p>
                </div>
            </div>
        </header>
        <!-- Sección de contenido -->
        <section class="py-5">
            <div class="container px-4 px-lg-5">
                <div class="row">
                    <div class="col-md-8">
                        <h4 class="mb-3">Datos de Envío</h4>
                        <!-- Formulario configurado para redirigir a formulariopago.html al dar clic en Confirmar Pedido -->
                        <form id="form-checkout" action="formulariopago.html" method="GET">
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label">Apellido</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Correo Electrónico</label>
                                    <input type="email" class="form-control" placeholder="correo@ejemplo.com" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Dirección</label>
                                    <input type="text" class="form-control" placeholder="Colonia, Calle, Casa" required>
                                </div>
                            </div>
                            <hr class="my-4">
                            <h4 class="mb-3">Método de Pago</h4>
                            <div class="form-check mb-4">
                                <input id="credit" name="paymentMethod" type="radio" class="form-check-input" checked required>
                                <label class="form-check-label" for="credit">Tarjeta de Crédito / Débito</label>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 btn-lg">Confirmar Pedido</button>
                        </form>
                    </div>
                    <div class="col-md-4">
                        <h4 class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-muted">Tu carrito</span>
                        </h4>
                        <ul id="checkout-resumen-lista" class="list-group mb-3">
                            <!-- Tu script checkout.js insertará aquí dinámicamente los productos -->
                        </ul>
                        <div class="card p-3">
                            <div class="d-flex justify-content-between align-items-center fw-bold">
                                <span>Total (LPS)</span>
                                <strong id="checkout-total">Lps 0.00</strong>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Pie de página -->
        <footer class="py-5 bg-dark">
            <div class="container text-center text-white">
                <p class="m-0">Copyright &copy; TecnoCompras 2026</p>
            </div>
        </footer>
        <!-- Scripts de Bootstrap y proyecto -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
        <script src="js/global.js"></script>
        <script src="js/checkout.js"></script>
    </body>
</html>
