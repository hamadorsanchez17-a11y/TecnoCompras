<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Crear una cuenta en la tienda" />
    <title>Registrarse - TecnoCompras</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Bootstrap iconos-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- CSS y bootstrap-->
    <link href="css/styles.css" rel="stylesheet" />
    <style>
        .login-bg {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('assets/fondo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 login-bg">

    <!-- Navigacion -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand fw-bold" href="index.html">TecnoCompras</a>
        </div>
    </nav>

    <!--Registro -->
    <section class="py-5 my-auto">
        <div class="container px-4 px-lg-5">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">
                    
                    <!-- Tarjeta de Registro -->
                    <div class="card shadow-lg border-0 rounded-3">
                        <div class="card-body p-4 p-sm-5">
                            
                            <div class="text-center mb-4">
                                <i class="bi bi-person-plus-fill display-4 text-dark"></i>
                                <h2 class="fw-bolder mt-2">Crear Cuenta</h2>
                                <p class="text-muted">Completa tus datos para registrarte en TecnoCompras</p>
                            </div>

                            <!-- Contenedor de alertas para mensajes de JavaScript -->
                            <div id="alertContainer"></div>

                            <!-- Formulario de Registro -->
                            <form id="formRegistro" novalidate>
                                
                                <!-- Nombre y Apellido -->
                                <div class="row g-2 mb-3">
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre" required />
                                            <label for="nombre"><i class="bi bi-person me-1"></i>Nombre</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Apellido" required />
                                            <label for="apellido"><i class="bi bi-person me-1"></i>Apellido</label>
                                        </div>
                                    </div>
                                </div>

                                <!-- Correo Electrónico -->
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="correo" name="correo" placeholder="nombre@ejemplo.com" required />
                                    <label for="correo"><i class="bi bi-envelope me-2"></i>Correo electrónico</label>
                                    <div id="errorCorreo" class="invalid-feedback">
                                        Ingresa un correo electrónico válido.
                                    </div>
                                </div>

                                <!-- Contraseña -->
                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" minlength="6" required />
                                    <label for="password"><i class="bi bi-lock me-2"></i>Contraseña</label>
                                </div>

                                <!-- Confirmar Contraseña -->
                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirmar Contraseña" required />
                                    <label for="confirm_password"><i class="bi bi-shield-lock me-2"></i>Confirmar contraseña</label>
                                    <div id="errorPassword" class="invalid-feedback">
                                        Las contraseñas no coinciden.
                                    </div>
                                </div>
                                
                                <div class="form-floating mb-3">
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="telefono"
                                        name="telefono"
                                        placeholder="Teléfono"
                                        required
                                    />
                                    <label for="telefono">
                                        <i class="bi bi-telephone me-2"></i>Teléfono
                                    </label>
                                </div>
                                
                                <!-- Términos y Condiciones -->
                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="terms" required />
                                    <label class="form-check-label text-secondary small" for="terms">
                                        Acepto los <a href="#!" class="text-dark fw-bold text-decoration-none">términos y condiciones</a>
                                    </label>
                                </div>

                                <!-- Botón de Registrarse -->
                                <div class="d-grid mb-3">
                                    <button class="btn btn-dark btn-lg fs-6 fw-bold" type="submit">Registrarse</button>
                                </div>

                                <hr class="my-4" />

                                <!-- Enlace de regreso -->
                                <div class="text-center">
                                    <span class="text-muted small">¿Ya tienes una cuenta?</span>
                                    <a class="text-dark fw-bold small text-decoration-none ms-1" href="index.html">Inicia sesión aquí</a>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    
    <footer class="py-4 bg-dark mt-auto">
        <div class="container"><p class="m-0 text-center text-white">Copyright &copy; TecnoCompras 2026</p></div>
    </footer>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script personalizado de validación -->
    <script src="js/registro.js"></script>
</body>
</html>
